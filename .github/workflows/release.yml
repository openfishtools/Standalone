name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '*.*.*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-and-release
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build Standalone Packages & Release
    runs-on: macos-latest

    steps:
      - name: Checkout Standalone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Studio repository
        uses: actions/checkout@v4
        with:
          repository: openfishtools/Studio
          path: .cache/Studio

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          fi

      - name: Ensure lld-link is available for Windows cross-compilation
        run: |
          if ! find "$HOME/.rustup/toolchains" -name "lld-link" 2>/dev/null | grep -q "lld-link"; then
            rustup toolchain install stable --profile minimal
          fi

      - name: Resolve version and tag
        id: version
        run: |
          PKG_VER=$(node -p "require('./package.json').version || '1.1.0'")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
            VERSION="${RAW_TAG#v}"
            TAG="${RAW_TAG}"
          else
            LATEST_TAG=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n 1)
            if [ -n "$LATEST_TAG" ]; then
              TAG_VER="${LATEST_TAG#v}"
            else
              TAG_VER="$PKG_VER"
            fi
            if [ "$PKG_VER" != "$TAG_VER" ]; then
              VERSION="$PKG_VER"
            else
              VERSION="$TAG_VER"
            fi
            TAG="v${VERSION}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -f "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG" --force
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (tag: $TAG)"

      - name: Build macOS, Windows, Android, and Dynamic OTA packages
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
          STUDIO_DIR: ${{ github.workspace }}/.cache/Studio
        run: |
          npm run build
          mkdir -p release-assets
          cp "dist-mac/FishTools_Studio_${APP_VERSION}_macOS_Universal.dmg" release-assets/
          cp "dist-win/FishTools_Studio_${APP_VERSION}_Windows_x64_Setup.exe" release-assets/
          cp "dist-win/FishTools_Studio_${APP_VERSION}_Windows_x64_Portable.zip" release-assets/
          cp "dist-android/FishTools_Studio_${APP_VERSION}_Android.apk" release-assets/
          cp "dist-ota/FishTools_Studio_OTA_v${APP_VERSION}.zip" release-assets/
          ls -lh release-assets/

      - name: Generate release notes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="${{ steps.version.outputs.TAG }}"
          cat > release_notes.md << EOF
          # FishTools Studio ${TAG}

          Official multiplatform standalone build of **FishTools Studio** with full GPU hardware acceleration and dynamic updates.

          ### Platforms & Artifacts
          - **macOS Universal**: \`FishTools_Studio_${VERSION}_macOS_Universal.dmg\` (Apple Silicon \`arm64\` + Intel \`x86_64\` with Metal acceleration)
          - **Windows x64 Setup**: \`FishTools_Studio_${VERSION}_Windows_x64_Setup.exe\` (DirectX 12 hardware acceleration)
          - **Windows x64 Portable**: \`FishTools_Studio_${VERSION}_Windows_x64_Portable.zip\`
          - **Android Signed APK**: \`FishTools_Studio_${VERSION}_Android.apk\` (v1 + v2 + v3 scheme signatures, hardware accelerated)
          - **Dynamic OTA Update**: \`FishTools_Studio_OTA_v${VERSION}.zip\` (Over-The-Air dynamic update package)
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "FishTools Studio ${{ steps.version.outputs.TAG }}"
          body_path: release_notes.md
          files: release-assets/*
          draft: false
          prerelease: false
          make_latest: true
