<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>FishTools Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="backdrop" class="modal-backdrop is-active">
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="status">
      <div class="drawer-handle" aria-hidden="true"></div>
      <div class="modal-body">
        <h2 id="status" class="modal-title">Updating...</h2>
        <div id="progress-track" class="progress-track">
          <div id="bar" class="progress-fill indeterminate"></div>
        </div>
        <div id="storage-box" class="storage-box hidden">
          <p class="storage-label">Folder penyimpanan proyek &amp; media:</p>
          <p id="storage-path" class="storage-path"></p>
        </div>
        <p id="meta" class="meta hidden"></p>
        <p id="gpu" class="gpu hidden"></p>
        <div id="actions" class="actions hidden">
          <button id="btn-pick-folder" class="btn btn-secondary hidden" type="button">Ubah Folder</button>
          <button id="btn-confirm-storage" class="btn btn-primary hidden" type="button">Lanjutkan</button>
          <button id="btn-skip" class="btn btn-secondary hidden" type="button">Lewati</button>
          <button id="btn-retry" class="btn btn-primary hidden" type="button">Coba Lagi</button>
          <button id="btn-open" class="btn btn-primary hidden" type="button">Buka Studio</button>
          <button id="btn-change-storage" class="btn btn-secondary hidden" type="button">Ganti Storage</button>
          <button id="btn-update" class="btn btn-secondary hidden" type="button">Perbarui</button>
          <button id="btn-clear" class="btn btn-danger hidden" type="button">Hapus Cache</button>
        </div>
      </div>
    </section>
  </div>
  <script src="loader.js"></script>
</body>
</html>
